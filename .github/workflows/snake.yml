name: 🐍 Neon Snake

on:
  schedule:
    - cron: "0 */12 * * *"   # har 12 soatda yangilanadi
  workflow_dispatch:          # qo'lda ishga tushirish tugmasi
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Neon snake yaratish
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-neon-dark.svg?palette=github-dark&color_snake=#00f5d4&color_dots=#161b22,#3a0ca3,#7209b7,#b5179e,#f72585&color_background=#0d1117
            dist/snake-neon-light.svg?color_snake=#7209b7&color_dots=#ebedf0,#c7f9cc,#80ffdb,#48bfe3,#5e60ce

      - name: output branchga joylash
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
