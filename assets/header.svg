<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420">
  <defs>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0" spreadMethod="repeat">
      <stop offset="0%" stop-color="#00f5d4"/>
      <stop offset="35%" stop-color="#7b5cff"/>
      <stop offset="65%" stop-color="#f72585"/>
      <stop offset="100%" stop-color="#00f5d4"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;0 0;-1 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>

    <radialGradient id="glowA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7209b7" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#7209b7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f5d4" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00f5d4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f72585" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#f72585" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="gridFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="gridMask"><rect x="0" y="250" width="1200" height="170" fill="url(#gridFade)"/></mask>

    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f5d4" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00f5d4"/>
      <stop offset="100%" stop-color="#f72585" stop-opacity="0"/>
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bigBlur"><feGaussianBlur stdDeviation="40"/></filter>

    <clipPath id="typeClip">
      <rect x="0" y="0" height="40" width="0">
        <animate attributeName="width" values="0;0;440;440;0" keyTimes="0;0.08;0.45;0.92;1" dur="7s" repeatCount="indefinite" calcMode="spline" keySplines="0 0 1 1;.4 0 .6 1;0 0 1 1;.4 0 .6 1"/>
      </rect>
    </clipPath>

    <clipPath id="roundCard"><rect width="1200" height="420" rx="22"/></clipPath>

    <style>
      .mono { font-family: 'JetBrains Mono','Fira Code',Consolas,'SFMono-Regular',Menlo,'Courier New',monospace; }
      .sans { font-family: 'Inter','Segoe UI','SF Pro Display',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif; }

      .float { animation: floatUp 14s linear infinite; opacity: 0; }
      @keyframes floatUp {
        0%   { transform: translateY(40px); opacity: 0; }
        15%  { opacity: .55; }
        80%  { opacity: .35; }
        100% { transform: translateY(-160px); opacity: 0; }
      }
      .pulse { animation: pulse 2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1);} 50% { opacity: .35; transform: scale(1.6);} }

      .breath { animation: breath 9s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes breath { 0%,100% { transform: scale(1); opacity: .9;} 50% { transform: scale(1.18); opacity: 1;} }
      .breath2 { animation: breath 11s ease-in-out -4s infinite; transform-box: fill-box; transform-origin: center; }

      .caret { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }

      .reveal { animation: reveal 1.4s cubic-bezier(.2,.8,.2,1) both; }
      .reveal2 { animation: reveal 1.4s cubic-bezier(.2,.8,.2,1) .35s both; }
      .reveal3 { animation: reveal 1.4s cubic-bezier(.2,.8,.2,1) .7s both; }
      @keyframes reveal { from { opacity: 0; transform: translateY(18px);} to { opacity: 1; transform: translateY(0);} }

      .scan { animation: scan 6s ease-in-out infinite; }
      @keyframes scan { 0% { transform: translateX(-250px); opacity:0;} 20%,80% {opacity:1;} 100% { transform: translateX(250px); opacity:0;} }

      .gridmove { animation: gridmove 3s linear infinite; }
      @keyframes gridmove { from { transform: translateY(0);} to { transform: translateY(30px);} }
    </style>
  </defs>

  <g clip-path="url(#roundCard)">
    <!-- fon -->
    <rect width="1200" height="420" fill="#0a0d14"/>

    <!-- nafas oluvchi rangli nurlar -->
    <g filter="url(#bigBlur)">
      <circle class="breath"  cx="250" cy="120" r="230" fill="url(#glowA)"/>
      <circle class="breath2" cx="980" cy="110" r="220" fill="url(#glowB)"/>
      <circle class="breath"  cx="640" cy="420" r="260" fill="url(#glowC)"/>
    </g>

    <!-- perspektiv grid (pastda harakatlanadi) -->
    <g mask="url(#gridMask)" stroke="#7b5cff" stroke-opacity=".22" stroke-width="1">
      <g class="gridmove">
        <line x1="0" y1="250" x2="1200" y2="250"/>
        <line x1="0" y1="280" x2="1200" y2="280"/>
        <line x1="0" y1="310" x2="1200" y2="310"/>
        <line x1="0" y1="340" x2="1200" y2="340"/>
        <line x1="0" y1="370" x2="1200" y2="370"/>
        <line x1="0" y1="400" x2="1200" y2="400"/>
        <line x1="0" y1="430" x2="1200" y2="430"/>
      </g>
      <line x1="600" y1="250" x2="600" y2="420"/>
      <line x1="600" y1="250" x2="420" y2="420"/><line x1="600" y1="250" x2="780" y2="420"/>
      <line x1="600" y1="250" x2="240" y2="420"/><line x1="600" y1="250" x2="960" y2="420"/>
      <line x1="600" y1="250" x2="60"  y2="420"/><line x1="600" y1="250" x2="1140" y2="420"/>
      <line x1="600" y1="250" x2="-120" y2="420"/><line x1="600" y1="250" x2="1320" y2="420"/>
    </g>

    <!-- suzib yuruvchi kod bo'laklari -->
    <g class="mono" font-size="15" fill="#8b9bb4">
      <text x="90"   y="330" class="float" style="animation-delay:0s">def build():</text>
      <text x="1010" y="300" class="float" style="animation-delay:2s">@router.message()</text>
      <text x="200"  y="250" class="float" style="animation-delay:4s" fill="#00f5d4">{ }</text>
      <text x="930"  y="360" class="float" style="animation-delay:6s">SELECT * FROM dreams</text>
      <text x="60"   y="200" class="float" style="animation-delay:8s" fill="#f72585">&lt;/&gt;</text>
      <text x="1080" y="230" class="float" style="animation-delay:10s">async</text>
      <text x="300"  y="380" class="float" style="animation-delay:12s">import django</text>
      <text x="840"  y="260" class="float" style="animation-delay:5s" fill="#7b5cff">git push</text>
    </g>

    <!-- orbita nuqtalari -->
    <g opacity=".8">
      <circle r="3" fill="#00f5d4" filter="url(#softGlow)">
        <animateMotion dur="18s" repeatCount="indefinite" path="M600,190 m-430,0 a430,120 0 1,0 860,0 a430,120 0 1,0 -860,0"/>
      </circle>
      <circle r="2.5" fill="#f72585" filter="url(#softGlow)">
        <animateMotion dur="24s" begin="-9s" repeatCount="indefinite" path="M600,190 m-500,0 a500,145 0 1,1 1000,0 a500,145 0 1,1 -1000,0"/>
      </circle>
    </g>

    <!-- terminal chip (tepada) -->
    <g class="reveal"><g transform="translate(600,58)">
      <rect x="-256" y="-22" width="512" height="44" rx="22" fill="#111827" fill-opacity=".75" stroke="#ffffff" stroke-opacity=".10"/>
      <circle cx="-226" cy="0" r="5" fill="#ff5f57"/>
      <circle cx="-210" cy="0" r="5" fill="#febc2e"/>
      <circle cx="-194" cy="0" r="5" fill="#28c840"/>
      <g transform="translate(-172,-20)">
        <g clip-path="url(#typeClip)">
          <text x="0" y="26" class="mono" font-size="16" fill="#c9d1d9"><tspan fill="#00f5d4">~/uz</tspan><tspan fill="#6e7681"> $ </tspan>python3 -c "print('Salom, dunyo!')"</text>
        </g>
      </g>
      <rect x="234" y="-9" width="9" height="18" fill="#00f5d4" class="caret"/>
    </g></g>

    <!-- ism: soya + yorqin gradient -->
    <g class="reveal2">
      <text x="600" y="205" text-anchor="middle" class="sans" font-size="112" font-weight="800" letter-spacing="-3" fill="#7b5cff" opacity=".35" filter="url(#bigBlur)">MirkomilCoder</text>
      <text x="600" y="205" text-anchor="middle" class="sans" font-size="112" font-weight="800" letter-spacing="-3" fill="url(#nameGrad)">MirkomilCoder</text>
    </g>

    <!-- skaner chiziq -->
    <g class="reveal2">
      <rect x="350" y="228" width="500" height="2" fill="#ffffff" fill-opacity=".06" rx="1"/>
      <rect x="500" y="227" width="200" height="4" rx="2" fill="url(#lineGrad)" class="scan" filter="url(#softGlow)"/>
    </g>

    <!-- subtitle -->
    <g class="reveal3">
      <text x="600" y="272" text-anchor="middle" class="mono" font-size="20" fill="#c9d1d9" letter-spacing="1">
        <tspan fill="#00f5d4">Backend</tspan><tspan fill="#6e7681">  ·  </tspan><tspan>Django</tspan><tspan fill="#6e7681">  ·  </tspan><tspan>Telegram Bots</tspan><tspan fill="#6e7681">  ·  </tspan><tspan fill="#f72585">Python</tspan>
      </text>
    </g>

    <!-- holat tabletkalari -->
    <g class="reveal3"><g transform="translate(600,326)">
      <g transform="translate(-205,0)">
        <rect x="-95" y="-19" width="190" height="38" rx="19" fill="#0f2a22" stroke="#28c840" stroke-opacity=".45"/>
        <circle cx="-72" cy="0" r="5" fill="#28c840" class="pulse"/>
        <circle cx="-72" cy="0" r="5" fill="#28c840"/>
        <text x="8" y="5" text-anchor="middle" class="sans" font-size="15" font-weight="600" fill="#7ee2a8">Open to work</text>
      </g>
      <g>
        <rect x="-95" y="-19" width="190" height="38" rx="19" fill="#161b2e" stroke="#7b5cff" stroke-opacity=".5"/>
        <text x="0" y="5" text-anchor="middle" class="sans" font-size="15" font-weight="600" fill="#c4b5fd">🇺🇿 Uzbekistan</text>
      </g>
      <g transform="translate(205,0)">
        <rect x="-95" y="-19" width="190" height="38" rx="19" fill="#2a0f1f" stroke="#f72585" stroke-opacity=".5"/>
        <text x="0" y="5" text-anchor="middle" class="sans" font-size="15" font-weight="600" fill="#ff8fc1">⚡ Build · Ship · Learn</text>
      </g>
    </g></g>

    <!-- nozik ramka -->
    <rect x=".5" y=".5" width="1199" height="419" rx="22" fill="none" stroke="#ffffff" stroke-opacity=".08"/>
  </g>
</svg>
